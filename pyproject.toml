[project]
name = "forget-lah"
version = "0.1.0"
description = "Patient follow-up: local foundation for the NUS-ISS hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "argon2-cffi>=23.1,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forget_lah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["postgres: requires the dedicated TEST_DATABASE_URL database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".venv", "node_modules", "apps/web/dist"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Formatting owns line wrapping; long literal values are permitted.

[tool.uv]
link-mode = "copy"

