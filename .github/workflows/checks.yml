name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: forget_lah_test
          POSTGRES_USER: forget_lah_test
          POSTGRES_PASSWORD: ci-only-ephemeral-database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forget_lah_test -d forget_lah_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://forget_lah_test:ci-only-ephemeral-database@localhost:5432/forget_lah_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
